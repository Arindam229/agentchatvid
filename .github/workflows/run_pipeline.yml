name: Automated Text-Video YouTube Pipeline

on:
  schedule:
    # Runs daily at 14:00 UTC (7:30 PM IST). You can adjust this cron schedule as desired.
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Credentials and Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 --decode > token.pickle
            echo "Successfully restored token.pickle from secrets."
          else
            echo "Warning: YOUTUBE_TOKEN_BASE64 secret is not set!"
          fi

      - name: Execute Autonomous Pipeline
        run: |
          python main.py
