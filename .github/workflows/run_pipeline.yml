name: Automated Multi-Agent YouTube Shorts Pipeline

on:
  schedule:
    # Runs daily at 14:00 UTC (7:30 PM IST)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  run-chatvid-pipeline:
    name: Run Chat Video Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Credentials and Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          echo "GOOGLE_API_KEY=$GEMINI_API_KEY" >> .env
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 --decode > token.pickle
            echo "Successfully restored token.pickle from secrets."
          else
            echo "Warning: YOUTUBE_TOKEN_BASE64 secret is not set!"
          fi

      - name: Execute Chat Video Pipeline
        run: |
          python main.py

  run-storyshorts-pipeline:
    name: Run StoryShorts Agent Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install faster-whisper requests

      - name: Restore Credentials and Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORYSHORTS_TOKEN_BASE64: ${{ secrets.STORYSHORTS_TOKEN_BASE64 }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          echo "GOOGLE_API_KEY=$GEMINI_API_KEY" >> .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > storyshortsagent/.env
          echo "GOOGLE_API_KEY=$GEMINI_API_KEY" >> storyshortsagent/.env
          
          # Restore token.json for StoryShorts agent
          if [ -n "$STORYSHORTS_TOKEN_BASE64" ]; then
            echo "$STORYSHORTS_TOKEN_BASE64" | base64 --decode > storyshortsagent/token.json
            echo "Successfully restored token.json from STORYSHORTS_TOKEN_BASE64."
          elif [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 --decode > storyshortsagent/token.json
            echo "Successfully restored token.json from YOUTUBE_TOKEN_BASE64 fallback."
          fi

      - name: Execute StoryShorts Pipeline
        run: |
          cd storyshortsagent
          python story_pipeline.py --no-svd

  run-gametrailers-pipeline:
    name: Run Game Trailers Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Restore Credentials and Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAMETRAILERS_TOKEN_BASE64: ${{ secrets.GAMETRAILERS_TOKEN_BASE64 }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          echo "GOOGLE_API_KEY=$GEMINI_API_KEY" >> .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > gametraileragent/.env
          echo "GOOGLE_API_KEY=$GEMINI_API_KEY" >> gametraileragent/.env
          
          # Restore token.json for GameTrailers agent
          if [ -n "$GAMETRAILERS_TOKEN_BASE64" ]; then
            echo "$GAMETRAILERS_TOKEN_BASE64" | base64 --decode > gametraileragent/token.json
            echo "Successfully restored token.json from GAMETRAILERS_TOKEN_BASE64."
          elif [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 --decode > gametraileragent/token.json
            echo "Successfully restored token.json from YOUTUBE_TOKEN_BASE64 fallback."
          fi

      - name: Execute Game Trailers Pipeline
        run: |
          cd gametraileragent
          python trailer_pipeline.py
